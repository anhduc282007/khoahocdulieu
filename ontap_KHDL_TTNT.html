<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Tập – Khoa Học Dữ Liệu & Trí Tuệ Nhân Tạo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#171b24;--bg3:#1e2330;--bg4:#252a38;
  --border:#2e3448;--border2:#3d4560;
  --text:#e8eaf2;--text2:#9ba3be;--text3:#636b88;
  --primary:#5b6aff;--primary2:#7481ff;--primary-bg:rgba(91,106,255,0.12);
  --green:#22c55e;--green-bg:rgba(34,197,94,0.12);
  --red:#ef4444;--red-bg:rgba(239,68,68,0.12);
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,0.12);
  --radius:10px;--radius-lg:16px;
}
body{background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',sans-serif;min-height:100vh;line-height:1.6}

/* SCREEN MANAGEMENT */
.screen{display:none}
.screen.active{display:block}

/* HOME */
#home{padding:2rem 1.5rem;max-width:800px;margin:0 auto}
.hero{text-align:center;padding:3rem 1rem 2rem}
.hero h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#7481ff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.hero p{color:var(--text2);font-size:.95rem}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:1.5rem 0}
.chapter-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.chapter-card:hover{border-color:var(--primary);background:var(--bg4);transform:translateY(-2px)}
.chapter-card .cd-num{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--primary2);font-weight:500;margin-bottom:.4rem}
.chapter-card h3{font-size:.95rem;font-weight:600;color:var(--text);line-height:1.4}
.chapter-card .cd-count{font-size:.75rem;color:var(--text3);margin-top:.5rem}
.chapter-card .cd-badge{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--primary-bg);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--primary2)}
.random-btn{width:100%;padding:1rem;background:linear-gradient(135deg,#5b6aff,#7c3aed);border:none;border-radius:var(--radius-lg);color:#fff;font-family:'Be Vietnam Pro',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:.5rem}
.random-btn:hover{opacity:.9}
.section-label{font-size:.75rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:1.5rem 0 .75rem}

/* QUIZ */
#quiz{display:flex;flex-direction:column;min-height:100vh}
.quiz-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:10}
.back-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:.4rem .8rem;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;font-size:.85rem;transition:all .2s}
.back-btn:hover{border-color:var(--border2);color:var(--text)}
.quiz-title{font-size:.9rem;font-weight:600;flex:1}
.quiz-meta{font-size:.8rem;color:var(--text2);font-family:'JetBrains Mono',monospace}
.progress-bar{height:3px;background:var(--border);position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#a78bfa);transition:width .3s;border-radius:2px}

.quiz-body{flex:1;padding:1.5rem;max-width:760px;width:100%;margin:0 auto}
.question-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1rem}
.q-num{font-size:.75rem;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-bottom:.6rem}
.q-text{font-size:1rem;font-weight:500;line-height:1.65;color:var(--text)}
.options{display:grid;gap:8px;margin-top:1.2rem}
.option{display:flex;align-items:flex-start;gap:.75rem;padding:.85rem 1rem;background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;text-align:left}
.option:hover:not(.disabled){border-color:var(--primary);background:var(--primary-bg)}
.option.selected{border-color:var(--primary);background:var(--primary-bg)}
.option.correct{border-color:var(--green);background:var(--green-bg)}
.option.wrong{border-color:var(--red);background:var(--red-bg)}
.option.disabled{cursor:default}
.opt-letter{width:26px;height:26px;min-width:26px;border-radius:6px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text2);transition:all .15s}
.option.selected .opt-letter{background:var(--primary);color:#fff}
.option.correct .opt-letter{background:var(--green);color:#fff}
.option.wrong .opt-letter{background:var(--red);color:#fff}
.opt-text{font-size:.9rem;line-height:1.5;color:var(--text);flex:1;padding-top:2px}

.nav-area{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:1rem 0 2rem}
.nav-btn{padding:.65rem 1.4rem;border-radius:var(--radius);font-family:'Be Vietnam Pro',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid var(--border)}
.nav-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.nav-btn.primary:hover{background:var(--primary2);border-color:var(--primary2)}
.nav-btn.ghost{background:transparent;color:var(--text2)}
.nav-btn.ghost:hover{border-color:var(--border2);color:var(--text)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}

.answered-count{font-size:.8rem;color:var(--text2);font-family:'JetBrains Mono',monospace;text-align:center;flex:1}

/* RESULT */
#result{padding:2rem 1.5rem;max-width:640px;margin:0 auto;text-align:center}
.result-circle{width:140px;height:140px;border-radius:50%;margin:2rem auto 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--primary);background:var(--primary-bg)}
.result-score{font-size:2.4rem;font-weight:700;color:var(--primary2)}
.result-label{font-size:.8rem;color:var(--text2);margin-top:.2rem}
.result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:1.5rem 0}
.stat-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:1rem .75rem}
.stat-val{font-size:1.4rem;font-weight:600}
.stat-key{font-size:.75rem;color:var(--text3);margin-top:.2rem}
.stat-box.g .stat-val{color:var(--green)}
.stat-box.r .stat-val{color:var(--red)}
.stat-box.p .stat-val{color:var(--primary2)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:1.5rem}
.result-actions button{padding:.85rem;border-radius:var(--radius);font-family:'Be Vietnam Pro',sans-serif;font-size:.95rem;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid var(--border)}
.result-actions .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.result-actions .btn-primary:hover{background:var(--primary2)}
.result-actions .btn-ghost{background:transparent;color:var(--text2)}
.result-actions .btn-ghost:hover{color:var(--text);border-color:var(--border2)}

/* REVIEW */
.review-section{text-align:left;margin-top:2rem}
.review-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:10px}
.review-item.wrong-q{border-color:rgba(239,68,68,.3)}
.review-q{font-size:.9rem;font-weight:500;margin-bottom:.8rem;line-height:1.5}
.review-opts{display:grid;gap:6px}
.review-opt{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem .8rem;border-radius:8px;font-size:.85rem;line-height:1.45}
.review-opt.c-ans{background:var(--green-bg);border:1px solid rgba(34,197,94,.3)}
.review-opt.w-sel{background:var(--red-bg);border:1px solid rgba(239,68,68,.3)}
.review-opt.normal{border:1px solid transparent}
.review-letter{font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:600;min-width:20px;color:var(--text3)}
.review-opt.c-ans .review-letter{color:var(--green)}
.review-opt.w-sel .review-letter{color:var(--red)}
.tag-wrong{font-size:.7rem;color:var(--red);background:var(--red-bg);padding:2px 8px;border-radius:20px;margin-left:.5rem;vertical-align:middle}
.tag-correct{font-size:.7rem;color:var(--green);background:var(--green-bg);padding:2px 8px;border-radius:20px;margin-left:.5rem;vertical-align:middle}

/* CHAPTER QUIZ MODE */
.submit-btn{width:100%;padding:1rem;background:var(--primary);border:none;border-radius:var(--radius-lg);color:#fff;font-family:'Be Vietnam Pro',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:.5rem}
.submit-btn:hover{opacity:.9}
.submit-btn:disabled{opacity:.4;cursor:not-allowed}

/* Nav dots */
.q-dots{display:flex;flex-wrap:wrap;gap:4px;margin:.5rem 0}
.q-dot{width:22px;height:22px;border-radius:5px;background:var(--bg4);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-family:'JetBrains Mono',monospace;color:var(--text3);transition:all .15s}
.q-dot:hover{border-color:var(--primary2)}
.q-dot.answered{background:var(--primary-bg);border-color:var(--primary);color:var(--primary2)}
.q-dot.active{background:var(--primary);border-color:var(--primary);color:#fff}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="hero">
    <h1>📊 Ôn Tập KHDL & TTNT</h1>
    <p>Khoa Học Dữ Liệu &amp; Trí Tuệ Nhân Tạo · Ngân hàng câu hỏi</p>
  </div>
  <div class="section-label">🎲 Thi ngẫu nhiên</div>
  <button class="random-btn" onclick="startRandom()">🎯 Tạo đề 60 câu ngẫu nhiên từ tất cả chương</button>
  <div class="section-label" style="margin-top:2rem">📚 Ôn tập theo chương</div>
  <div class="chapter-grid" id="chapterGrid"></div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <button class="back-btn" onclick="goHome()">← Trang chủ</button>
    <div class="quiz-title" id="quizTitle">Đề ôn tập</div>
    <div class="quiz-meta" id="quizMeta">0/0</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="quiz-body">
    <div class="q-dots" id="qDots"></div>
    <div id="questionArea"></div>
    <div class="nav-area">
      <button class="nav-btn ghost" id="prevBtn" onclick="changeQ(-1)">← Trước</button>
      <div class="answered-count" id="answeredCount"></div>
      <button class="nav-btn primary" id="nextBtn" onclick="handleNext()">Tiếp →</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-circle">
    <div class="result-score" id="resultScore">0%</div>
    <div class="result-label">Điểm số</div>
  </div>
  <h2 id="resultTitle" style="font-size:1.2rem;font-weight:600;margin-bottom:.4rem"></h2>
  <p id="resultMsg" style="color:var(--text2);font-size:.9rem"></p>
  <div class="result-stats">
    <div class="stat-box g"><div class="stat-val" id="r-correct">0</div><div class="stat-key">Đúng</div></div>
    <div class="stat-box r"><div class="stat-val" id="r-wrong">0</div><div class="stat-key">Sai</div></div>
    <div class="stat-box p"><div class="stat-val" id="r-total">0</div><div class="stat-key">Tổng câu</div></div>
  </div>
  <div class="result-actions">
    <button class="btn-primary result-actions-btn" onclick="retryQuiz()">🔄 Làm lại đề này</button>
    <button class="btn-ghost result-actions-btn" onclick="goHome()">🏠 Trang chủ</button>
  </div>
  <div class="review-section">
    <div class="section-label" style="text-align:left">📋 Xem lại đáp án</div>
    <div id="reviewList"></div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  // CĐ1
  {ch:'CĐ1',q:'Trí tuệ nhân tạo (AI) thường được định nghĩa là ngành khoa học máy tính liên quan đến điều gì?',opts:['Phát triển phần cứng máy tính tiên tiến','Tự động hóa các hành vi thông minh','Nghiên cứu về tâm lý học con người','Ứng dụng toán học trong kinh tế'],ans:1},
  {ch:'CĐ1',q:'Mục tiêu chính của trí tuệ nhân tạo KHÔNG bao gồm điều nào sau đây?',opts:['Đưa máy móc trở nên thông minh hơn','Phục vụ lợi ích cho con người','Thay thế hoàn toàn lao động con người trong mọi lĩnh vực','Khiến máy móc phát triển hòa bình và hỗ trợ lẫn nhau với con người'],ans:2},
  {ch:'CĐ1',q:'Theo tài liệu, các định nghĩa về AI được chia thành mấy nhóm chính?',opts:['2','3','4','5'],ans:2},
  {ch:'CĐ1',q:'Nhóm định nghĩa AI nào tập trung vào việc xây dựng hệ thống có khả năng suy nghĩ một cách logic và hợp lý?',opts:['Các hệ thống suy nghĩ (thông minh) như con người','Các hệ thống suy nghĩ một cách hợp lý','Các hệ thống hành động (thông minh) như con người','Các hệ thống hành động một cách hợp lý'],ans:1},
  {ch:'CĐ1',q:'Phép thử Turing được sử dụng để đánh giá điều gì?',opts:['Khả năng tính toán của máy tính','Khả năng bảo mật của hệ thống AI','Mức độ thông minh của máy tính thông qua hành vi tương tự con người','Hiệu suất của thuật toán học máy'],ans:2},
  {ch:'CĐ1',q:'Ai là người đề xuất phép thử Turing?',opts:['John McCarthy','Alan Turing','Herbert Simon','Marvin Minsky'],ans:1},
  {ch:'CĐ1',q:'Trong phép thử Turing, người thẩm vấn KHÔNG được phép sử dụng phương tiện giao tiếp nào sau đây?',opts:['Văn bản viết','Câu hỏi','Giọng nói','Màn hình máy tính'],ans:2},
  {ch:'CĐ1',q:'Nhược điểm chính của phép thử Turing theo tài liệu là gì?',opts:['Quá dễ để máy tính vượt qua','Không phản ánh đầy đủ trí tuệ thực sự của máy móc, chỉ tập trung vào hành vi','Đòi hỏi người thẩm vấn phải có kiến thức chuyên sâu về AI','Chi phí thực hiện quá cao'],ans:1},
  {ch:'CĐ1',q:'Hệ thống AI nào được xem là hệ thống giải quyết vấn đề tổng quát, mô phỏng chuỗi suy nghĩ của con người?',opts:['ELIZA','GPS (General Problem Solver)','Deep Blue','AlphaGo'],ans:1},
  {ch:'CĐ1',q:'Cách tiếp cận "suy nghĩ hợp lý" trong AI tập trung vào việc xây dựng hệ thống dựa trên nền tảng nào?',opts:['Mạng nơ-ron nhân tạo','Logic và lập luận','Dữ liệu lớn','Mô phỏng não bộ con người'],ans:1},
  {ch:'CĐ1',q:'Theo tài liệu, ngôn ngữ lập trình nào KHÔNG được đề cập đến như một nền tảng của AI?',opts:['Lisp','Prolog','Python','Không có đáp án đúng'],ans:2},
  {ch:'CĐ1',q:'Giai đoạn nào được coi là "giai đoạn tiền khởi đầu" của AI?',opts:['1943-1955','1952-1969','1969-1979','1980 đến nay'],ans:0},
  {ch:'CĐ1',q:'Sự kiện nào KHÔNG thuộc giai đoạn khởi đầu (1952-1969) của AI?',opts:['Đề xuất thuật ngữ "Trí tuệ nhân tạo"','Phát triển Perceptron','Ra đời chương trình ELIZA','Deep Blue đánh bại Garry Kasparov'],ans:3},
  {ch:'CĐ1',q:'"Mùa đông AI" lần thứ nhất diễn ra trong khoảng thời gian nào?',opts:['1952-1969','1974-1980','1980-1988','1987-1993'],ans:1},
  {ch:'CĐ1',q:'Nguyên nhân chính dẫn đến giai đoạn "mùa đông AI" là gì?',opts:['Thiếu kinh phí nghiên cứu từ chính phủ','Sự xuất hiện của Internet và dữ liệu lớn','Những khó khăn trong việc hiện thực hóa các dự đoán lạc quan ban đầu, "bùng nổ tổ hợp" và hạn chế của cách tiếp cận đơn giản','Cạnh tranh gay gắt giữa các nhà nghiên cứu AI'],ans:2},
  {ch:'CĐ1',q:'Hệ thống chuyên gia (Expert Systems) trở nên phổ biến trong giai đoạn nào của lịch sử AI?',opts:['Giai đoạn khởi đầu (1952-1969)','Giai đoạn trầm lắng (1974-1980)','Hệ thống dựa trên tri thức (1969-1979)','Trí tuệ nhân tạo có sản phẩm thương mại (1980 đến nay)'],ans:2},
  {ch:'CĐ1',q:'Chương trình máy tính nào đầu tiên đánh bại nhà vô địch cờ vua thế giới?',opts:['Logic Theorist','GPS','Deep Blue','AlphaGo'],ans:2},
  {ch:'CĐ1',q:'Robot nào được xem là robot đầu tiên được cấp quyền công dân?',opts:['ASIMO','Shakey','Kismet','Sophia'],ans:3},
  {ch:'CĐ1',q:'Xu hướng phát triển AI nào được nhấn mạnh từ giai đoạn 2001 đến nay?',opts:['Tập trung vào thuật toán phức tạp','Dựa trên tri thức chuyên gia','Dựa trên dữ liệu lớn và học máy','Mô phỏng hoàn toàn nhận thức con người'],ans:2},
  {ch:'CĐ1',q:'Mô hình ngôn ngữ tự nhiên GPT-3 được phát hành vào năm nào?',opts:['2019','2020','2022','2023'],ans:1},
  // CĐ2
  {ch:'CĐ2',q:'Khoa học dữ liệu là gì?',opts:['Một lĩnh vực nghiên cứu về toán học và thống kê','Một lĩnh vực nghiên cứu về dữ liệu và cách khai thác thông tin từ chúng','Một ngành khoa học chỉ liên quan đến máy tính','Một ngành khoa học chỉ sử dụng các phương pháp nghiên cứu lý thuyết'],ans:1},
  {ch:'CĐ2',q:'Dữ liệu nào dưới đây được xem là dữ liệu có cấu trúc?',opts:['Video đánh giá sản phẩm','Email (người gửi, người nhận, nội dung)','Lịch sử giao dịch của khách hàng (ngày, sản phẩm, số tiền)','Bài đăng trên mạng xã hội'],ans:2},
  {ch:'CĐ2',q:'Kỹ thuật nào dưới đây không phải là phương pháp phân tích dữ liệu không cấu trúc?',opts:['Xử lý ngôn ngữ tự nhiên (NLP)','Phân tích hồi quy','Thị giác máy tính','Chuyển đổi giọng nói thành văn bản'],ans:1},

];

let currentQuestions = [];
let userAnswers = [];
let currentIdx = 0;
let quizMode = ''; // 'random' | 'chapter'
let lastQuestions = [];

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}

function buildHome(){
  const grid = document.getElementById('chapterGrid');
  grid.innerHTML = CHAPTERS.map((c,i)=>{
    const qs = ALL_QUESTIONS.filter(q=>q.ch===c.id);
    return `<div class="chapter-card" onclick="startChapter('${c.id}')">
      <div class="cd-badge">${String.fromCodePoint(0x31+i)}</div>
      <div class="cd-num">${c.id}</div>
      <h3>${c.desc}</h3>
      <div class="cd-count">${qs.length} câu hỏi</div>
    </div>`;
  }).join('');
}

function startRandom(){
  const qs = shuffle(ALL_QUESTIONS).slice(0,60);
  launchQuiz(qs,'random','🎲 Đề ngẫu nhiên 60 câu');
}

function startChapter(chId){
  const qs = shuffle(ALL_QUESTIONS.filter(q=>q.ch===chId));
  const ch = CHAPTERS.find(c=>c.id===chId);
  launchQuiz(qs,'chapter',`${chId} – ${ch.desc}`);
}

function launchQuiz(qs,mode,title){
  currentQuestions = qs;
  lastQuestions = qs;
  userAnswers = new Array(qs.length).fill(null);
  currentIdx = 0;
  quizMode = mode;
  document.getElementById('quizTitle').textContent = title;
  buildDots();
  renderQuestion(0);
  show('quiz');
}

function buildDots(){
  const el = document.getElementById('qDots');
  el.innerHTML = currentQuestions.map((_,i)=>`<div class="q-dot" id="dot${i}" onclick="jumpTo(${i})">${i+1}</div>`).join('');
}

function jumpTo(i){
  currentIdx=i;
  renderQuestion(i);
}

function renderQuestion(i){
  const q = currentQuestions[i];
  const answered = userAnswers[i];
  const letters = ['A','B','C','D'];
  document.getElementById('quizMeta').textContent = `${i+1}/${currentQuestions.length}`;
  document.getElementById('progressFill').style.width = `${(i+1)/currentQuestions.length*100}%`;
  const answeredCount = userAnswers.filter(a=>a!==null).length;
  document.getElementById('answeredCount').textContent = `Đã trả lời: ${answeredCount}/${currentQuestions.length}`;
  document.getElementById('prevBtn').disabled = i===0;
  const isLast = i===currentQuestions.length-1;
  const nextBtn = document.getElementById('nextBtn');
  if(isLast){
    nextBtn.textContent = '📊 Xem kết quả';
    nextBtn.className='nav-btn primary';
  } else {
    nextBtn.textContent = 'Tiếp →';
    nextBtn.className='nav-btn primary';
  }

  const optHtml = q.opts.map((o,oi)=>{
    let cls = 'option';
    if(answered!==null){
      cls+=' disabled';
      if(oi===q.ans) cls+=' correct';
      else if(oi===answered && answered!==q.ans) cls+=' wrong';
    } else if(answered===oi) cls+=' selected';
    return `<div class="${cls}" onclick="selectOpt(${oi})">
      <div class="opt-letter">${letters[oi]}</div>
      <div class="opt-text">${o}</div>
    </div>`;
  }).join('');
  
  document.getElementById('questionArea').innerHTML = `
    <div class="question-card">
      <div class="q-num">${q.ch} · Câu ${i+1}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optHtml}</div>
    </div>`;
  updateDots();
}

function updateDots(){
  currentQuestions.forEach((_,i)=>{
    const d = document.getElementById('dot'+i);
    if(!d) return;
    d.className = 'q-dot';
    if(i===currentIdx) d.classList.add('active');
    else if(userAnswers[i]!==null) d.classList.add('answered');
  });
}

function selectOpt(oi){
  if(userAnswers[currentIdx]!==null) return;
  userAnswers[currentIdx]=oi;
  renderQuestion(currentIdx);
}

function changeQ(dir){
  const ni = currentIdx+dir;
  if(ni<0||ni>=currentQuestions.length) return;
  currentIdx=ni;
  renderQuestion(ni);
}

function handleNext(){
  if(currentIdx===currentQuestions.length-1){
    showResult();
  } else {
    changeQ(1);
  }
}

function showResult(){
  let correct=0;
  userAnswers.forEach((a,i)=>{ if(a===currentQuestions[i].ans) correct++; });
  const total=currentQuestions.length;
  const pct=Math.round(correct/total*100);
  document.getElementById('resultScore').textContent=pct+'%';
  let title='',msg='';
  if(pct>=90){title='🏆 Xuất sắc!';msg='Bạn nắm vững nội dung rất tốt. Tiếp tục phát huy!';}
  else if(pct>=75){title='👏 Tốt lắm!';msg='Kết quả khá tốt. Ôn lại các câu sai để hoàn thiện hơn.';}
  else if(pct>=50){title='📚 Cần cố gắng thêm';msg='Bạn cần ôn luyện thêm. Xem lại đáp án phía dưới nhé!';}
  else{title='💪 Hãy ôn tập lại!';msg='Điểm chưa cao. Hãy học kỹ từng chuyên đề rồi thử lại.';}
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultMsg').textContent=msg;
  document.getElementById('r-correct').textContent=correct;
  document.getElementById('r-wrong').textContent=total-correct;
  document.getElementById('r-total').textContent=total;
  buildReview();
  show('result');
}

function buildReview(){
  const list = document.getElementById('reviewList');
  const letters=['A','B','C','D'];
  list.innerHTML = currentQuestions.map((q,i)=>{
    const ua=userAnswers[i];
    const isCorrect=ua===q.ans;
    const tag=ua===null?'<span class="tag-wrong">Chưa trả lời</span>':isCorrect?'<span class="tag-correct">Đúng</span>':'<span class="tag-wrong">Sai</span>';
    const optsHtml=q.opts.map((o,oi)=>{
      let cls='review-opt normal';
      if(oi===q.ans) cls='review-opt c-ans';
      else if(oi===ua&&ua!==q.ans) cls='review-opt w-sel';
      return `<div class="${cls}"><span class="review-letter">${letters[oi]}</span>${o}</div>`;
    }).join('');
    return `<div class="review-item${isCorrect?'':' wrong-q'}">
      <div class="review-q"><strong>${i+1}.</strong> ${q.q} ${tag}</div>
      <div class="review-opts">${optsHtml}</div>
    </div>`;
  }).join('');
}

function retryQuiz(){
  launchQuiz(shuffle(lastQuestions),quizMode,document.getElementById('quizTitle').textContent);
}

function goHome(){show('home');}

function show(screenId){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  window.scrollTo(0,0);
}

// init
buildHome();
</script>
</body>
</html>
